global:
  ingress:
    hosts:
    - backend:
        serviceName: "test-app-server"
        portNumber: 80
      name: "tobi-preprod.sdid-app-hp.cpin.numerique-interieur.com"
      pathType: "Prefix"
      path: "/api"
    - backend:
        serviceName: "test-app-client"
        portNumber: 80
      name: "tobi-preprod.sdid-app-hp.cpin.numerique-interieur.com"
      pathType: "Prefix"
      path: "/"
    tls:
    - secretName: "tobi-preprod.sdid-app-hp.cpin.numerique-interieur.com-tls"
      hosts:
      - "tobi-preprod.sdid-app-hp.cpin.numerique-interieur.com"

client:
  env:
    VITE_API_URL: "https://tobi-preprod.sdid-app-hp.cpin.numerique-interieur.com/api"
