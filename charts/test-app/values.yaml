# -- Provide a name in place of the default application name.
# @section -- General
nameOverride: ""
# -- String to fully override the default application name.
# @section -- General
fullnameOverride: ""

global:
  # -- Map of environment variables to inject into all containers.
  # @section -- Global
  env: {}
  # -- Map of environment variables to inject into all containers.
  # @section -- Global
  secrets: {}
  # -- Whether or not ingress should be enabled globally, it could be shared by all components that support ingress.
  # @section -- Global
  ingress: {}
  # enabled: false
  # className: ""
  # annotations: {}
  # labels: {}
  # hosts:
  # - backend:
  #     serviceName: ""
  #     portNumber: null
  #   name: "domain.local"
  #   pathType: "Prefix"
  #   path: "/"
  # tls:
  # - secretName: domain.local-tls
  #   hosts:
  #   - domain.local

api:
  # -- Should the app run as a StatefulSet instead of a Deployment.
  # @section -- Api
  statefulset: false
  # -- The number of application controller pods to run.
  # @section -- Api
  replicaCount: 1
  image:
    # -- Repository to use for the app.
    # @section -- Api
    repository: "ghcr.io/dnum-mi/test-app-api"
    # -- Image pull policy for the app.
    # @section -- Api
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Api
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Api
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Api
    className: ""
    # -- Additional ingress annotations.
    # @section -- Api
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Api
    labels: {}
    hosts:
      - backend:
          # -- Name of the backend service linked to the host record (leave empty to use the app service).
          # @section -- Api
          serviceName: ""
          # -- Port used by the backend service linked to the host record (leave null to use the app service port).
          # @section -- Api
          portNumber: null
        # -- Name of the host record.
        # @section -- Api
        name: "domain.local"
        # -- Path type of the host record.
        # @section -- Api
        pathType: "Prefix"
        # -- Path of the host record to manage routing.
        # @section -- Api
        path: "/"
    # -- Enable TLS configuration.
    # @section -- Api
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  # -- Annotations for the app deployed pods.
  # @section -- Api
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Api
  podLabels: {}
  # -- Toggle and define pod-level security context.
  # @section -- Api
  podSecurityContext: {}
  # fsGroup: 2000
  # -- Init containers to add to the app pod.
  # @section -- Api
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Api
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Api container port number.
  # @section -- Api
  containerPort: &apiContainerPort 8080
  # -- Api container port name.
  # @section -- Api
  containerPortName: "http"
  # -- Api extra container ports.
  # @section -- Api
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Api container command.
  # @section -- Api
  command: []
  # -- Api container command args.
  # @section -- Api
  args: []
  # -- Toggle and define container-level security context.
  # @section -- Api
  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  # -- Api container env variables loaded from configmap or secret reference.
  # @section -- Api
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Api container env variables, it will be injected into a configmap and loaded into the container.
  # @section -- Api
  env: {}
  # -- Api container env secrets, it will be injected into a secret and loaded into the container.
  # @section -- Api
  secrets: {}
  probes:
    startupProbe:
      httpGet:
        # -- Api container healthcheck endpoint (startupProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Api
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Api
        port: *apiContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Api
      initialDelaySeconds: 0
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Api
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Api
      failureThreshold: 10
      # -- How often (in seconds) to perform the probe.
      # @section -- Api
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Api
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        # -- Api container healthcheck endpoint (readinessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Api
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Api
        port: *apiContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Api
      initialDelaySeconds: 10
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Api
      successThreshold: 2
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Api
      failureThreshold: 2
      # -- How often (in seconds) to perform the probe.
      # @section -- Api
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Api
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        # -- Api container healthcheck endpoint (livenessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Api
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Api
        port: *apiContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Api
      initialDelaySeconds: 30
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Api
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Api
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Api
      periodSeconds: 30
      # -- Number of seconds after which the probe times out.
      # @section -- Api
      timeoutSeconds: 5
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # @section -- Api
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Api
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Api
      maxSurge: 1
  # -- Image credentials configuration.
  # @section -- Api
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  # -- Host aliases that will be injected at pod-level into /etc/hosts.
  # @section -- Api
  hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.1.2.3"
  #   hostnames:
  #   - "foo.remote"
  #   - "bar.remote"
  # -- List of volumes to add.
  # @section -- Api
  volumes: []
  # - name: config-volume
  #   configMap:
  #     name: log-config
  #     items:
  #       - key: log_level
  #         path: log_level.conf
  # - name: cache-volume
  #   emptyDir:
  #     sizeLimit: 500Mi
  # - name: image-volume
  #   image:
  #     reference: quay.io/crio/artifact:v2
  #     pullPolicy: IfNotPresent
  # -- List of volumeClaims to add.
  # @section -- Api
  volumeClaims: []
  # - metadata:
  #     name: app-volume
  #   spec:
  #     accessModes: [ "ReadWriteOnce" ]
  #     storageClassName: "my-storage-class"
  #     resources:
  #       requests:
  #         storage: 1Gi
  # -- List of mounts to add (normally used with `volumes` or `volumeClaims`).
  # @section -- Api
  volumeMounts: []
  # - name: config-volume
  #   mountPath: /app/config
  #   subPath: config
  #   readOnly: true
  #   mountPropagation: None
  #   recursiveReadOnly: Enabled
  # - name: cache-volume
  #   mountPath: /app/cache
  # - name: image-volume
  #   mountPath: /app/content
  # - name: storage-volume
  #   mountPath: /app/storage
  service:
    # -- Type of service to create for the app.
    # @section -- Api
    type: "ClusterIP"
    # -- Port used by the service.
    # @section -- Api
    port: 80
    # -- Port used when type is `NodePort` to expose the service on the given node port.
    # @section -- Api
    nodePort: 31000
    # -- Port name used by the service.
    # @section -- Api
    portName: "http"
    # -- Protocol used by the service.
    # @section -- Api
    protocol: "TCP"
    # -- Extra service ports.
    # @section -- Api
    extraPorts: []
    # - port: 9090
    #   targetPort: 9090
    #   protocol: "TCP" 
    #   name: "metrics"
  resources:
    requests:
      # -- Memory request for the app.
      # @section -- Api
      memory: "64Mi"
      # -- CPU request for the app.
      # @section -- Api
      cpu: "50m"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "100Mi"
    limits:
      # -- Memory limit for the app.
      # @section -- Api
      memory: "128Mi"
      # -- CPU limit for the app.
      # @section -- Api
      cpu: "50m"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "500Mi"
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler for the app.
    # @section -- Api
    enabled: false
    # -- Minimum number of replicas for the app.
    # @section -- Api
    minReplicas: 1
    # -- Maximum number of replicas for the app.
    # @section -- Api
    maxReplicas: 3
    # -- Average CPU utilization percentage for the app.
    # @section -- Api
    targetCPUUtilizationPercentage: 80
    # -- Average memory utilization percentage for the app.
    # @section -- Api
    targetMemoryUtilizationPercentage: 80
  # -- Revision history limit for the app.
  # @section -- Api
  revisionHistoryLimit: 10
  # -- Default node selector for app.
  # @section -- Api
  nodeSelector: {}
  # kubernetes.io/os: "linux"
  # kubernetes.io/arch: "amd64"
  # kubernetes.io/hostname: "node1"
  # -- Default tolerations for app.
  # @section -- Api
  tolerations: []
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  #   tolerationSeconds: 3600
  # - key: "key2"
  #   operator: "Equal"
  #   value: "value2"
  #   effect: "NoExecute"
  #   tolerationSeconds: 3600
  # - key: "key3"
  #   operator: "Exists"
  #   effect: "PreferNoSchedule"
  #   tolerationSeconds: 3600
  # -- Affinity used for app pod.
  # @section -- Api
  affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions:
  #       - key: "app.kubernetes.io/name"
  #         operator: "In"
  #         values:
  #         - "test-app-api"
  #     topologyKey: "kubernetes.io/hostname"
  serviceAccount:
    # -- Enable the service account.
    # @section -- Api
    enabled: false
    # -- Create a service account.
    # @section -- Api
    create: false
    # -- Annotations applied to created service account.
    # @section -- Api
    annotations: {}
    # -- Service account name.
    # @section -- Api
    name: ""
    # -- Should the service account access token be automount in the pod.
    # @section -- Api
    automountServiceAccountToken: false
    role:
      # -- Should the role be created.
      # @section -- Api
      create: false
      # -- Role rules associated with the service account.
      # @section -- Api
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Api
      create: false
      # -- ClusterRole rules associated with the service account.
      # @section -- Api
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a PodDisruptionBudget for the app
    # @section -- Api
    enabled: false
    # -- Labels to be added to app pdb.
    # @section -- Api
    labels: {}
    # -- Annotations to be added to app pdb.
    # @section -- Api
    annotations: {}
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%).
    # @section -- Api
    # @default -- `""` (defaults to 0 if not specified)
    minAvailable: ""
    # -- Number of pods that are unavailable after eviction as number or percentage (eg.: 50%). Has higher precedence over `api.pdb.minAvailable`.
    # @section -- Api
    maxUnavailable: ""
  networkPolicy:
    # -- Create NetworkPolicy object for the app.
    # @section -- Api
    create: false
    # -- Policy types used in the NetworkPolicy object.
    # @section -- Api
    policyTypes:
      - Ingress
    # -- Ingress rules for the NetworkPolicy object.
    # @section -- Api
    ingress: []
    # - from:
    #   - ipBlock:
    #       cidr: 172.17.0.0/16
    #       except:
    #       - 172.17.1.0/24
    #   - namespaceSelector:
    #       matchLabels:
    #         project: myproject
    #   - podSelector:
    #       matchLabels:
    #         role: frontend
    #   ports:
    #   - protocol: TCP
    #     port: 6379
    # -- Egress rules for the NetworkPolicy object.
    # @section -- Api
    egress: []
    # - to:
    #   - ipBlock:
    #       cidr: 10.0.0.0/24
    #   ports:
    #   - protocol: TCP
    #     port: 32000
    #     endPort: 32768
  metrics:
    # -- Deploy metrics service.
    # @section -- Api
    enabled: false
    service:
      # -- Metrics service annotations.
      # @section -- Api
      annotations: {}
      # -- Metrics service labels.
      # @section -- Api
      labels: {}
      # -- Metrics service port.
      # @section -- Api
      port: 9000
      # -- Metrics service target port.
      # @section -- Api
      targetPort: 9000
    serviceMonitor:
      # -- Enable a prometheus ServiceMonitor.
      # @section -- Api
      enabled: false
      # -- Prometheus ServiceMonitor labels.
      # @section -- Api
      labels: {}
      # -- Prometheus ServiceMonitor annotations.
      # @section -- Api
      annotations: {}
      endpoints:
        - basicAuth:
            # -- The secret in the service monitor namespace that contains the username for authentication.
            # @section -- Api
            username: ""
            # -- The secret in the service monitor namespace that contains the password for authentication.
            # @section -- Api
            password: ""
          bearerTokenSecret:
            # -- Secret name to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Api
            name: ""
            # -- Secret key to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Api
            key: ""
          # -- Prometheus ServiceMonitor interval.
          # @section -- Api
          interval: "30s"
          # -- Prometheus ServiceMonitor scrapeTimeout. If empty, Prometheus uses the global scrape timeout unless it is less than the target's scrape interval value in which the latter is used.
          # @section -- Api
          scrapeTimeout: "10s"
          # -- Path used by the Prometheus ServiceMonitor to scrape metrics.
          # @section -- Api
          path: "/metrics"
          # -- When true, honorLabels preserves the metric’s labels when they collide with the target’s labels.
          # @section -- Api
          honorLabels: false
          # -- Prometheus RelabelConfigs to apply to samples before scraping.
          # @section -- Api
          relabelings: []
          # -- Prometheus MetricRelabelConfigs to apply to samples before ingestion.
          # @section -- Api
          metricRelabelings: []
          # -- Prometheus ServiceMonitor selector.
          # @section -- Api
          selector: {}
          # prometheus: kube-prometheus
          # -- Prometheus ServiceMonitor scheme.
          # @section -- Api
          scheme: ""
          # -- Prometheus ServiceMonitor tlsConfig.
          # @section -- Api
          tlsConfig: {}

frontend:
  # -- Should the app run as a StatefulSet instead of a Deployment.
  # @section -- Frontend
  statefulset: false
  # -- The number of application controller pods to run.
  # @section -- Frontend
  replicaCount: 1
  image:
    # -- Repository to use for the app.
    # @section -- Frontend
    repository: "ghcr.io/dnum-mi/test-app-frontend"
    # -- Image pull policy for the app.
    # @section -- Frontend
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Frontend
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Frontend
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Frontend
    className: ""
    # -- Additional ingress annotations.
    # @section -- Frontend
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Frontend
    labels: {}
    hosts:
      - backend:
          # -- Name of the backend service linked to the host record (leave empty to use the app service).
          # @section -- Frontend
          serviceName: ""
          # -- Port used by the backend service linked to the host record (leave null to use the app service port).
          # @section -- Frontend
          portNumber: null
        # -- Name of the host record.
        # @section -- Frontend
        name: "domain.local"
        # -- Path type of the host record.
        # @section -- Frontend
        pathType: "Prefix"
        # -- Path of the host record to manage routing.
        # @section -- Frontend
        path: "/"
    # -- Enable TLS configuration.
    # @section -- Frontend
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  # -- Annotations for the app deployed pods.
  # @section -- Frontend
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Frontend
  podLabels: {}
  # -- Toggle and define pod-level security context.
  # @section -- Frontend
  podSecurityContext: {}
  # fsGroup: 2000
  # -- Init containers to add to the app pod.
  # @section -- Frontend
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Frontend
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Frontend container port number.
  # @section -- Frontend
  containerPort: &frontendContainerPort 8080
  # -- Frontend container port name.
  # @section -- Frontend
  containerPortName: "http"
  # -- Frontend extra container ports.
  # @section -- Frontend
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Frontend container command.
  # @section -- Frontend
  command: []
  # -- Frontend container command args.
  # @section -- Frontend
  args: []
  # -- Toggle and define container-level security context.
  # @section -- Frontend
  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  # -- Frontend container env variables loaded from configmap or secret reference.
  # @section -- Frontend
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Frontend container env variables, it will be injected into a configmap and loaded into the container.
  # @section -- Frontend
  env: {}
  # -- Frontend container env secrets, it will be injected into a secret and loaded into the container.
  # @section -- Frontend
  secrets: {}
  probes:
    startupProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (startupProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 0
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 10
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (readinessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 10
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 2
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 2
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (livenessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 30
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 30
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # @section -- Frontend
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Frontend
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Frontend
      maxSurge: 1
  # -- Image credentials configuration.
  # @section -- Frontend
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  # -- Host aliases that will be injected at pod-level into /etc/hosts.
  # @section -- Frontend
  hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.1.2.3"
  #   hostnames:
  #   - "foo.remote"
  #   - "bar.remote"
  # -- List of volumes to add.
  # @section -- Frontend
  volumes: []
  # - name: config-volume
  #   configMap:
  #     name: log-config
  #     items:
  #       - key: log_level
  #         path: log_level.conf
  # - name: cache-volume
  #   emptyDir:
  #     sizeLimit: 500Mi
  # - name: image-volume
  #   image:
  #     reference: quay.io/crio/artifact:v2
  #     pullPolicy: IfNotPresent
  # -- List of volumeClaims to add.
  # @section -- Frontend
  volumeClaims: []
  # - metadata:
  #     name: app-volume
  #   spec:
  #     accessModes: [ "ReadWriteOnce" ]
  #     storageClassName: "my-storage-class"
  #     resources:
  #       requests:
  #         storage: 1Gi
  # -- List of mounts to add (normally used with `volumes` or `volumeClaims`).
  # @section -- Frontend
  volumeMounts: []
  # - name: config-volume
  #   mountPath: /app/config
  #   subPath: config
  #   readOnly: true
  #   mountPropagation: None
  #   recursiveReadOnly: Enabled
  # - name: cache-volume
  #   mountPath: /app/cache
  # - name: image-volume
  #   mountPath: /app/content
  # - name: storage-volume
  #   mountPath: /app/storage
  service:
    # -- Type of service to create for the app.
    # @section -- Frontend
    type: "ClusterIP"
    # -- Port used by the service.
    # @section -- Frontend
    port: 80
    # -- Port used when type is `NodePort` to expose the service on the given node port.
    # @section -- Frontend
    nodePort: 31000
    # -- Port name used by the service.
    # @section -- Frontend
    portName: "http"
    # -- Protocol used by the service.
    # @section -- Frontend
    protocol: "TCP"
    # -- Extra service ports.
    # @section -- Frontend
    extraPorts: []
    # - port: 9090
    #   targetPort: 9090
    #   protocol: "TCP" 
    #   name: "metrics"
  resources:
    requests:
      # -- Memory request for the app.
      # @section -- Api
      memory: "64Mi"
      # -- CPU request for the app.
      # @section -- Api
      cpu: "50m"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "100Mi"
    limits:
      # -- Memory limit for the app.
      # @section -- Api
      memory: "128Mi"
      # -- CPU limit for the app.
      # @section -- Api
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "500Mi"
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler for the app.
    # @section -- Frontend
    enabled: false
    # -- Minimum number of replicas for the app.
    # @section -- Frontend
    minReplicas: 1
    # -- Maximum number of replicas for the app.
    # @section -- Frontend
    maxReplicas: 3
    # -- Average CPU utilization percentage for the app.
    # @section -- Frontend
    targetCPUUtilizationPercentage: 80
    # -- Average memory utilization percentage for the app.
    # @section -- Frontend
    targetMemoryUtilizationPercentage: 80
  # -- Revision history limit for the app.
  # @section -- Frontend
  revisionHistoryLimit: 10
  # -- Default node selector for app.
  # @section -- Frontend
  nodeSelector: {}
  # kubernetes.io/os: "linux"
  # kubernetes.io/arch: "amd64"
  # kubernetes.io/hostname: "node1"
  # -- Default tolerations for app.
  # @section -- Frontend
  tolerations: []
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  #   tolerationSeconds: 3600
  # - key: "key2"
  #   operator: "Equal"
  #   value: "value2"
  #   effect: "NoExecute"
  #   tolerationSeconds: 3600
  # - key: "key3"
  #   operator: "Exists"
  #   effect: "PreferNoSchedule"
  #   tolerationSeconds: 3600
  # -- Affinity used for app pod.
  # @section -- Frontend
  affinity: {}
