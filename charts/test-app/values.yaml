  #     topologyKey: "kubernetes.io/hostname"
  serviceAccount:
    # -- Enable the service account.
    # @section -- Server
    enabled: false
    # -- Create a service account.
    # @section -- Server
    create: false
    # -- Annotations applied to created service account.
    # @section -- Server
    annotations: {}
    # -- Service account name.
    # @section -- Server
    name: ""
    # -- Should the service account access token be automount in the pod.
    # @section -- Server
    automountServiceAccountToken: false
    role:
      # -- Should the role be created.
      # @section -- Server
      create: false
      # -- Role rules associated with the service account.
      # @section -- Server
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Server
      create: false
      # -- ClusterRole rules associated with the service account.
      # @section -- Server
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a PodDisruptionBudget for the app
    # @section -- Server
    enabled: false
    # -- Labels to be added to app pdb.
    # @section -- Server
    labels: {}
    # -- Annotations to be added to app pdb.
    # @section -- Server
    annotations: {}
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%).
    # @section -- Server
    # @default -- `""` (defaults to 0 if not specified)
    minAvailable: ""
    # -- Number of pods that are unavailable after eviction as number or percentage (eg.: 50%). Has higher precedence over `server.pdb.minAvailable`.
    # @section -- Server
    maxUnavailable: ""
  networkPolicy:
    # -- Create NetworkPolicy object for the app.
    # @section -- Server
    create: false
    # -- Policy types used in the NetworkPolicy object.
    # @section -- Server
    policyTypes:
      - Ingress
    # -- Ingress rules for the NetworkPolicy object.
    # @section -- Server
    ingress: []
    # - from:
    #   - ipBlock:
    #       cidr: 172.17.0.0/16
    #       except:
    #       - 172.17.1.0/24
    #   - namespaceSelector:
