{{- if and .Values.server.serviceAccount.enabled .Values.server.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.server.serviceAccount.name | default (printf "%s-%s" (include "helper.fullname" .) "server") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "server")) | nindent 4 }}
  {{- if .Values.server.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.server.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.server.serviceAccount.automountServiceAccountToken }}
{{- end }}
