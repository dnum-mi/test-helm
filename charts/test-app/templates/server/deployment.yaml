{{- if not .Values.server.statefulset }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "server" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "server")) | nindent 4 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.server.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "server") | nindent 6 }}
  strategy:
    type: {{ .Values.server.strategy.type }}
    {{- if eq .Values.server.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.server.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.server.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    metadata:
      {{- if or .Values.server.podAnnotations .Values.server.secrets .Values.server.env .Values.global.env .Values.global.secrets }}
      annotations:
        {{- include "helper.checksum" (list $ "/server/configmap.yaml") | nindent 8 }}
        {{- include "helper.checksum" (list $ "/server/secret.yaml") | nindent 8 }}
        {{- if .Values.server.podAnnotations }}
        {{- toYaml .Values.server.podAnnotations | nindent 8 }}
        {{- end }}
      {{- end }}
      labels: {{- include "helper.labels" (dict "root" . "componentName" "server") | nindent 8 }}
        {{- if .Values.server.podLabels }}
        {{- toYaml .Values.server.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.server.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.server.imagePullSecrets }}
      - name: {{ .name }}
      {{- end }}
      {{- end }}
      {{- if (get .Values "server").serviceAccount.enabled }}
      serviceAccountName: {{ .Values.server.serviceAccount.name | default (printf "%s-%s" (include "helper.fullname" .) "server") }}
      {{- end }}
      {{- if .Values.server.podSecurityContext }}
      securityContext: {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.server.initContainers }}
      initContainers: {{- tpl (toYaml .Values.server.initContainers) . | nindent 6 }}
      {{- end }}
      containers:
      - name: server
        {{- if .Values.server.securityContext }}
        securityContext: {{- toYaml .Values.server.securityContext | nindent 10 }}
        {{- end }}
        image: "{{ .Values.global.imageRegistry | default .Values.server.image.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        {{- if .Values.server.command }}
        command:
        {{- range .Values.server.command }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.server.args }}
        args:
        {{- range .Values.server.args }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.server.containerPort }}
          name: {{ .Values.server.containerPortName | default "http" }}
          protocol: TCP
        {{- if .Values.server.extraPorts }}
          {{- toYaml .Values.server.extraPorts | nindent 8 }}
        {{- end }}
        {{- if or .Values.server.envCm .Values.global.envCm .Values.server.envSecret .Values.global.envSecret .Values.server.envFrom }}
        envFrom:
        {{- if or .Values.server.envCm .Values.global.envCm }}
        - configMapRef:
            name: {{ printf "%s-%s" (include "helper.fullname" .) "server" }}
        {{- end }}
        {{- if or .Values.server.envSecret .Values.global.envSecret }}
        - secretRef:
            name: {{ printf "%s-%s" (include "helper.fullname" .) "server" }}
        {{- end }}
        {{- if .Values.server.envFrom }}
          {{- toYaml .Values.server.envFrom | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if .Values.server.env }}
        env: {{- include "helper.env.map-to-array" .Values.server.env | nindent 8 }}
        {{- end -}}
        {{- if .Values.server.probes.startupProbe }}
        startupProbe: {{- toYaml .Values.server.probes.startupProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.server.probes.readinessProbe }}
        readinessProbe: {{- toYaml .Values.server.probes.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.server.probes.livenessProbe }}
        livenessProbe: {{- toYaml .Values.server.probes.livenessProbe | nindent 10 }}
        {{- end }}
        resources: {{- toYaml .Values.server.resources | nindent 10 }}
        {{- if .Values.server.volumeMounts }}
        volumeMounts: {{- toYaml .Values.server.volumeMounts | nindent 8 }}
        {{- end }}
      {{- if .Values.server.extraContainers }}
        {{- tpl (toYaml .Values.server.extraContainers) . | nindent 6 }}
      {{- end }}
      {{- if .Values.server.hostAliases }}
      hostAliases: {{- toYaml .Values.server.hostAliases | nindent 6 }}
      {{- end }}
      {{- if .Values.server.nodeSelector }}
      nodeSelector: {{- toYaml .Values.server.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.server.affinity }}
      affinity: {{- toYaml .Values.server.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.server.tolerations }}
      tolerations: {{- toYaml .Values.server.tolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.server.volumes }}
      volumes: {{- toYaml .Values.server.volumes | nindent 6 }}
      {{- end }}
{{- end }}
