{{- if or .Values.frontend.env .Values.global.env -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
data:
  {{- if .Values.global.env -}}
  {{- include "helper.env" .Values.global | indent 2 }}
  {{- end -}}
  {{- if .Values.frontend.env -}}
  {{- include "helper.env" .Values.frontend | indent 2 }}
  {{- end -}}
{{- end -}}
