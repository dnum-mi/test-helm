{{- if or .Values.frontend.secrets .Values.global.secrets -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
data:
  {{- if .Values.global.secrets -}}
  {{- include "helper.secret" .Values.global | indent 2 }}
  {{- end -}}
  {{- if .Values.frontend.secrets -}}
  {{- include "helper.secret" .Values.frontend | indent 2 }}
  {{- end -}}
{{- end -}}
