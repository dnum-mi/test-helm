{{- if not .Values.frontend.statefulset }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.frontend.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "frontend") | nindent 6 }}
  strategy:
    type: {{ .Values.frontend.strategy.type }}
    {{- if eq .Values.frontend.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.frontend.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.frontend.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    metadata:
      {{- if or .Values.frontend.podAnnotations .Values.frontend.secrets .Values.frontend.env .Values.global.env .Values.global.secrets }}
      annotations:
        {{- include "helper.checksum" (list $ "/frontend/configmap.yaml") | nindent 8 }}
        {{- include "helper.checksum" (list $ "/frontend/secret.yaml") | nindent 8 }}
        {{- if .Values.frontend.podAnnotations }}
        {{- toYaml .Values.frontend.podAnnotations | nindent 8 }}
        {{- end }}
      {{- end }}
      labels: {{- include "helper.labels" (dict "root" . "componentName" "frontend") | nindent 8 }}
        {{- if .Values.frontend.podLabels }}
        {{- toYaml .Values.frontend.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.frontend.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.frontend.imagePullSecrets }}
      - name: {{ .name }}
      {{- end }}
      {{- end }}
      {{- if (get .Values "frontend").serviceAccount.enabled }}
      serviceAccountName: {{ .Values.frontend.serviceAccount.name | default (printf "%s-%s" (include "helper.fullname" .) "frontend") }}
      {{- end }}
      {{- if .Values.frontend.podSecurityContext }}
      securityContext: {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.frontend.initContainers }}
      initContainers: {{- tpl (toYaml .Values.frontend.initContainers) . | nindent 6 }}
      {{- end }}
      containers:
      - name: frontend
        {{- if .Values.frontend.securityContext }}
        securityContext: {{- toYaml .Values.frontend.securityContext | nindent 10 }}
        {{- end }}
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        {{- if .Values.frontend.command }}
        command:
        {{- range .Values.frontend.command }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.frontend.args }}
        args:
        {{- range .Values.frontend.args }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.frontend.containerPort }}
          name: {{ .Values.frontend.containerPortName | default "http" }}
          protocol: TCP
        {{- if .Values.frontend.extraPorts }}
          {{- toYaml .Values.frontend.extraPorts | nindent 8 }}
        {{- end }}
        {{- if or .Values.frontend.env .Values.global.env .Values.global.secrets .Values.global.secrets .Values.frontend.envFrom }}
        envFrom:
        {{- if or .Values.frontend.env .Values.global.env }}
        - configMapRef:
            name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
        {{- end }}
        {{- if or .Values.frontend.secrets .Values.global.secrets }}
        - secretRef:
            name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
        {{- end }}
        {{- if .Values.frontend.envFrom }}
          {{- toYaml .Values.frontend.envFrom | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if .Values.frontend.probes.startupProbe }}
        startupProbe: {{- toYaml .Values.frontend.probes.startupProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.frontend.probes.readinessProbe }}
        readinessProbe: {{- toYaml .Values.frontend.probes.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.frontend.probes.livenessProbe }}
        livenessProbe: {{- toYaml .Values.frontend.probes.livenessProbe | nindent 10 }}
        {{- end }}
        resources: {{- toYaml .Values.frontend.resources | nindent 10 }}
        {{- if .Values.frontend.volumeMounts }}
        volumeMounts: {{- toYaml .Values.frontend.volumeMounts | nindent 8 }}
        {{- end }}
      {{- if .Values.frontend.extraContainers }}
        {{- tpl (toYaml .Values.frontend.extraContainers) . | nindent 6 }}
      {{- end }}
      {{- if .Values.frontend.hostAliases }}
      hostAliases: {{- toYaml .Values.frontend.hostAliases | nindent 6 }}
      {{- end }}
      {{- if .Values.frontend.nodeSelector }}
      nodeSelector: {{- toYaml .Values.frontend.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.frontend.affinity }}
      affinity: {{- toYaml .Values.frontend.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.frontend.tolerations }}
      tolerations: {{- toYaml .Values.frontend.tolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.frontend.volumes }}
      volumes: {{- toYaml .Values.frontend.volumes | nindent 6 }}
      {{- end }}
{{- end }}
