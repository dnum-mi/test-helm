{{- if not .Values.client.statefulset }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "client" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "client")) | nindent 4 }}
spec:
  {{- if not .Values.client.autoscaling.enabled }}
  replicas: {{ .Values.client.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.client.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "client") | nindent 6 }}
  strategy:
    type: {{ .Values.client.strategy.type }}
    {{- if eq .Values.client.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.client.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.client.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    metadata:
      {{- if or .Values.client.podAnnotations .Values.client.secrets .Values.client.env .Values.global.env .Values.global.secrets }}
      annotations:
        {{- include "helper.checksum" (list $ "/client/configmap.yaml") | nindent 8 }}
        {{- include "helper.checksum" (list $ "/client/secret.yaml") | nindent 8 }}
        {{- if .Values.client.podAnnotations }}
        {{- toYaml .Values.client.podAnnotations | nindent 8 }}
        {{- end }}
      {{- end }}
      labels: {{- include "helper.labels" (dict "root" . "componentName" "client") | nindent 8 }}
        {{- if .Values.client.podLabels }}
        {{- toYaml .Values.client.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.client.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.client.imagePullSecrets }}
      - name: {{ .name }}
      {{- end }}
      {{- end }}
      {{- if (get .Values "client").serviceAccount.enabled }}
      serviceAccountName: {{ .Values.client.serviceAccount.name | default (printf "%s-%s" (include "helper.fullname" .) "client") }}
      {{- end }}
      {{- if .Values.client.podSecurityContext }}
      securityContext: {{- toYaml .Values.client.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.client.initContainers }}
      initContainers: {{- tpl (toYaml .Values.client.initContainers) . | nindent 6 }}
      {{- end }}
      containers:
      - name: client
        {{- if .Values.client.securityContext }}
        securityContext: {{- toYaml .Values.client.securityContext | nindent 10 }}
        {{- end }}
        image: "{{ .Values.global.imageRegistry | default .Values.client.image.registry }}/{{ .Values.client.image.repository }}:{{ .Values.client.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.client.image.pullPolicy }}
        {{- if .Values.client.command }}
        command:
        {{- range .Values.client.command }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.client.args }}
        args:
        {{- range .Values.client.args }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.client.containerPort }}
          name: {{ .Values.client.containerPortName | default "http" }}
          protocol: TCP
        {{- if .Values.client.extraPorts }}
          {{- toYaml .Values.client.extraPorts | nindent 8 }}
        {{- end }}
        {{- if or .Values.client.envCm .Values.global.envCm .Values.client.envSecret .Values.global.envSecret .Values.client.envFrom }}
        envFrom:
        {{- if or .Values.client.envCm .Values.global.envCm }}
        - configMapRef:
            name: {{ printf "%s-%s" (include "helper.fullname" .) "client" }}
        {{- end }}
        {{- if or .Values.client.envSecret .Values.global.envSecret }}
        - secretRef:
            name: {{ printf "%s-%s" (include "helper.fullname" .) "client" }}
        {{- end }}
        {{- if .Values.client.envFrom }}
          {{- toYaml .Values.client.envFrom | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if .Values.client.env }}
        env: {{- include "helper.env.map-to-array" .Values.client.env | nindent 8 }}
        {{- end -}}
        {{- if .Values.client.probes.startupProbe }}
        startupProbe: {{- toYaml .Values.client.probes.startupProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.client.probes.readinessProbe }}
        readinessProbe: {{- toYaml .Values.client.probes.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.client.probes.livenessProbe }}
        livenessProbe: {{- toYaml .Values.client.probes.livenessProbe | nindent 10 }}
        {{- end }}
        resources: {{- toYaml .Values.client.resources | nindent 10 }}
        {{- if .Values.client.volumeMounts }}
        volumeMounts: {{- toYaml .Values.client.volumeMounts | nindent 8 }}
        {{- end }}
      {{- if .Values.client.extraContainers }}
        {{- tpl (toYaml .Values.client.extraContainers) . | nindent 6 }}
      {{- end }}
      {{- if .Values.client.hostAliases }}
      hostAliases: {{- toYaml .Values.client.hostAliases | nindent 6 }}
      {{- end }}
      {{- if .Values.client.nodeSelector }}
      nodeSelector: {{- toYaml .Values.client.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.client.affinity }}
      affinity: {{- toYaml .Values.client.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.client.tolerations }}
      tolerations: {{- toYaml .Values.client.tolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.client.volumes }}
      volumes: {{- toYaml .Values.client.volumes | nindent 6 }}
      {{- end }}
{{- end }}
