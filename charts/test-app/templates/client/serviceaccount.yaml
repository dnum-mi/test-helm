{{- if and .Values.client.serviceAccount.enabled .Values.client.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.client.serviceAccount.name | default (printf "%s-%s" (include "helper.fullname" .) "client") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "client")) | nindent 4 }}
  {{- if .Values.client.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.client.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.client.serviceAccount.automountServiceAccountToken }}
{{- end }}
