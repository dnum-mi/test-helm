apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "client" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "client")) | nindent 4 }}
spec:
  type: {{ .Values.client.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.client.service.port | default 80 }}
    targetPort: {{ .Values.client.containerPortName | default .Values.client.containerPort | default 8080 }}
    protocol: {{ .Values.client.service.protocol | default "TCP" }}
    {{- if eq .Values.client.service.type "NodePort" }}
    nodePort: {{ .Values.client.service.nodePort }}
    {{- end }}
    name: {{ .Values.client.service.portName | default "http" }}
  {{- if .Values.client.service.extraPorts -}}
  {{- toYaml .Values.client.service.extraPorts | nindent 2 -}}
  {{- end }}
  selector: {{- include "helper.selectorLabels" (dict "root" . "componentName" "client") | nindent 4 }}
