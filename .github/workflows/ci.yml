name: CI

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    paths:
    - 'charts/**'
  workflow_dispatch:

env:
  CT_CONF_PATH: ci/configs/ct.yaml

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      CT_CONF_PATH: ${{ env.CT_CONF_PATH }}
    steps:
    - name: Exposing env vars
      run: echo "Exposing env vars"

  lint-commits:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-commits.yml@main
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: read
      contents: read

  lint-helm-docs:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-helm.yml@main
    needs:
    - expose-vars
    permissions:
      contents: read
    with:
      HELM_DOCS_VERSION: v1.14.2
      CT_CONF_PATH: ${{ needs.expose-vars.outputs.CT_CONF_PATH }}
      LINT_CHARTS: false
      LINT_DOCS: true

  lint-helm-charts:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-helm.yml@main
    needs:
    - expose-vars
    permissions:
      contents: read
    with:
      HELM_DOCS_VERSION: v1.14.2
      CT_CONF_PATH: ${{ needs.expose-vars.outputs.CT_CONF_PATH }}
      LINT_CHARTS: true
      LINT_DOCS: false

  test-helm-charts:
    uses: dnum-mi/fabnum-cicd/.github/workflows/test-helm.yml@main
    needs:
    - expose-vars
    with:
      CT_CONF_PATH: ${{ needs.expose-vars.outputs.CT_CONF_PATH }}
