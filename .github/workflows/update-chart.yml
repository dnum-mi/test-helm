name: Update chart

on:
  workflow_call:
    inputs:
      RUN_MODE:
        description: Execution mode 'caller' (trigger remote repo workflow) or 'called' (update chart in current repo)
        required: false
        type: string
        default: called
      CHART_DIR:
        description: Name of the folder containing the chart (in CHART_REPO)
        required: false
        type: string
        default: charts
      CHART_NAME:
        description: Name of the folder chart (in /charts)
        required: true
        type: string
      APP_VERSION:
        description: The app version to inject in Chart.yaml
        required: true
        type: string
      UPGRADE_TYPE:
        description: Should update 'major', 'minor', 'patch' or 'prerelease'
        required: false
        type: string
        default: patch
      PRERELEASE_IDENTIFIER:
        description: Identifier used when UPGRADE_TYPE=prerelease (e.g. rc)
        required: false
        type: string
        default: rc
      AUTOMERGE_PRERELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is 'prerelease' (requires GH_PAT)
        required: false
        type: boolean
        default: false
      AUTOMERGE_RELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is not 'prerelease' (requires GH_PAT)
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: Execution mode 'caller' (trigger remote repo workflow) or 'called' (update chart in current repo)
        required: false
        type: choice
        options:
        - caller
        - called
        default: called
      CHART_DIR:
        description: Name of the folder containing the chart (in CHART_REPO)
        required: false
        type: string
        default: charts
      CHART_NAME:
        description: Name of the folder chart (in /charts)
        required: true
        type: string
      APP_VERSION:
        description: The app version to inject in Chart.yaml
        required: true
        type: string
      UPGRADE_TYPE:
        description: Should update 'major', 'minor' or 'patch'
        required: false
        type: choice
        options:
        - major
        - minor
        - patch
        - prerelease
        default: patch
      PRERELEASE_IDENTIFIER:
        description: Identifier used when UPGRADE_TYPE=prerelease (e.g. rc)
        required: false
        type: string
        default: rc
      AUTOMERGE_PRERELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is 'prerelease' (requires GH_PAT)
        required: false
        type: boolean
        default: false
      AUTOMERGE_RELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is not 'prerelease' (requires GH_PAT)
        required: false
        type: boolean
        default: false

jobs:
  bump-chart:
    uses: dnum-mi/fabnum-cicd/.github/workflows/update-helm-chart.yml@v0
    permissions:
      pull-requests: write
      contents: write
    with:
      RUN_MODE: ${{ inputs.RUN_MODE }}
      CHART_DIR: ${{ inputs.CHART_DIR }}
      CHART_NAME: ${{ inputs.CHART_NAME }}
      APP_VERSION: ${{ inputs.APP_VERSION }}
      UPGRADE_TYPE: ${{ inputs.UPGRADE_TYPE }}
      PRERELEASE_IDENTIFIER: ${{ inputs.PRERELEASE_IDENTIFIER }}
      AUTOMERGE_PRERELEASE: ${{ inputs.AUTOMERGE_PRERELEASE }}
      AUTOMERGE_RELEASE: ${{ inputs.AUTOMERGE_RELEASE }}
