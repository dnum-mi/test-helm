name: Update chart

on:
  workflow_call:
    inputs:
      RUN_MODE:
        description: >-
          Delivery mode sent by the dispatching repository - always 'called'.
          Declared because GitHub rejects a dispatch carrying an input this
          workflow does not declare; the job below pins its own style anyway.
        required: false
        type: string
        default: called
      CHART_DIR:
        description: Name of the folder containing the chart (in CHART_REPO)
        required: false
        type: string
        default: charts
      CHART_NAME:
        description: Name of the folder chart (in /charts)
        required: true
        type: string
      APP_VERSION:
        description: The app version to inject in Chart.yaml
        required: true
        type: string
      UPGRADE_TYPE:
        description: Should update 'major', 'minor', 'patch' or 'prerelease'
        required: false
        type: string
        default: patch
      PRERELEASE_IDENTIFIER:
        description: Identifier used when UPGRADE_TYPE=prerelease (e.g. rc)
        required: false
        type: string
        default: rc
      AUTOMERGE_PRERELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is 'prerelease' (requires an App or GH_PAT credential)
        required: false
        type: boolean
        default: false
      AUTOMERGE_RELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is not 'prerelease' (requires an App or GH_PAT credential)
        required: false
        type: boolean
        default: false
      AUTOMERGE_METHOD:
        description: How the chart update PR is merged when automerge is enabled - 'auto' (queue, needs Allow auto-merge) or 'admin' (merge immediately)
        required: false
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: >-
          Accepted for dispatch compatibility only - this repository always
          delivers the bump as a pull request, because cd.yml releases the
          chart on push to main.
        required: false
        type: choice
        options:
        - called
        default: called
      CHART_DIR:
        description: Name of the folder containing the chart (in CHART_REPO)
        required: false
        type: string
        default: charts
      CHART_NAME:
        description: Name of the folder chart (in /charts)
        required: true
        type: string
      APP_VERSION:
        description: The app version to inject in Chart.yaml
        required: true
        type: string
      UPGRADE_TYPE:
        description: Should update 'major', 'minor' or 'patch'
        required: false
        type: choice
        options:
        - major
        - minor
        - patch
        - prerelease
        default: patch
      PRERELEASE_IDENTIFIER:
        description: Identifier used when UPGRADE_TYPE=prerelease (e.g. rc)
        required: false
        type: string
        default: rc
      AUTOMERGE_PRERELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is 'prerelease' (requires an App or GH_PAT credential)
        required: false
        type: boolean
        default: false
      AUTOMERGE_RELEASE:
        description: Automatically merge the PR when UPGRADE_TYPE is not 'prerelease' (requires an App or GH_PAT credential)
        required: false
        type: boolean
        default: false
      AUTOMERGE_METHOD:
        description: How the chart update PR is merged when automerge is enabled
        required: false
        type: choice
        options:
        - auto
        - admin
        default: auto

# Two app releases dispatching a bump for the same chart would otherwise race on
# the same branch and pull request. Serialize per chart; never cancel, or a bump
# is silently dropped and the chart stays behind the app it tracks.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.CHART_NAME }}
  cancel-in-progress: false

jobs:
  bump-chart:
    uses: dnum-mi/fabnum-cicd/.github/workflows/update-helm-chart.yml@v0
    permissions:
      pull-requests: write
      contents: write
    with:
      # Pinned, not forwarded: this repository is PR-gated - cd.yml releases the
      # chart on push to main, so the bump has to arrive as a pull request.
      RUN_MODE: called
      CHART_DIR: ${{ inputs.CHART_DIR }}
      CHART_NAME: ${{ inputs.CHART_NAME }}
      APP_VERSION: ${{ inputs.APP_VERSION }}
      UPGRADE_TYPE: ${{ inputs.UPGRADE_TYPE }}
      PRERELEASE_IDENTIFIER: ${{ inputs.PRERELEASE_IDENTIFIER }}
      AUTOMERGE_PRERELEASE: ${{ inputs.AUTOMERGE_PRERELEASE }}
      AUTOMERGE_RELEASE: ${{ inputs.AUTOMERGE_RELEASE }}
      AUTOMERGE_METHOD: ${{ inputs.AUTOMERGE_METHOD }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
