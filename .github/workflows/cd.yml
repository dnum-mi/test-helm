name: Release Charts

on:
  push:
    branches:
    - main
    paths:
    - 'charts/**'
  workflow_dispatch:

# Chart releases publish to the same index; overlapping runs would race on it.
# Queue rather than cancel - a half-published chart is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-charts:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-helm.yml@v0
    permissions:
      contents: write
      packages: write
    with:
      CHARTS_DIR: ./charts
      # Both channels are set explicitly, against the workflow's defaults
      # (CREATE_GITHUB_RELEASE on, PUBLISH_OCI off), because this repository is
      # private. The classic channel needs index.yaml served from a pages
      # branch, and a GitHub Pages site is public even when its repository is
      # not - anything below GitHub Enterprise Cloud cannot restrict it - so it
      # would publish a catalogue of our chart names and versions to the open
      # internet. OCI has no such problem: the ghcr.io package follows the
      # repository's visibility and consumers authenticate with
      # `helm registry login`.
      CREATE_GITHUB_RELEASE: false
      PUBLISH_OCI: true
      HELM_REPOS: "bitnami=https://charts.bitnami.com/bitnami,hashicorp=https://helm.releases.hashicorp.com,cnpg=https://cloudnative-pg.github.io/charts"

  sync-cpin:
    uses: dnum-mi/fabnum-cicd/.github/workflows/sync-cpin.yml@v0
    needs:
    - release-charts
    # Opt-in: set the repository variable CPIN_AUTO_SYNC to 'true' to sync a
    # chart release to CPiN automatically (gh variable set CPIN_AUTO_SYNC --body true).
    # Off by default while the GitLab mirror is not reachable from the runners;
    # until then trigger the mirror pipeline by hand.
    if: ${{ vars.CPIN_AUTO_SYNC == 'true' }}
    # Posts to the GitLab mirror API and touches nothing on GitHub.
    permissions: {}
    with:
      GITLAB_URL: ${{ vars.GITLAB_URL }}
      GIT_MIRROR_PROJECT_ID: ${{ vars.GIT_MIRROR_PROJECT_ID }}
      BRANCH_TO_SYNC: main
      REPOSITORY_NAME: ${{ vars.REPOSITORY_NAME }}
    secrets:
      GIT_MIRROR_TOKEN: ${{ secrets.GIT_MIRROR_TOKEN }}
