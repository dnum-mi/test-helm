include:
  - project: $CATALOG_PATH
    file:
      - vault-ci.yml
      - helm-ci.yml
    ref: main

default:
  image: alpine/helm:4.1.3

variables:
  CHARTS_DIR: ./charts

stages:
  - read-secret
  - helm-package

read_secret:
  stage: read-secret
  extends: .vault:read_secret

helm-package-push:
  stage: helm-package
  extends: .helm:build-push
  only:
    - tags
    - main
